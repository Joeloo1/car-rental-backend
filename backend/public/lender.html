<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lender Chat</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background: #f0f4f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      #chat-widget {
        width: 420px;
        height: 600px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #chat-header {
        background: #1a73e8;
        color: white;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      #borrower-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid rgba(255, 255, 255, 0.4);
      }

      #borrower-name {
        font-weight: 600;
        font-size: 15px;
      }
      #chat-status {
        font-size: 12px;
        opacity: 0.8;
        margin-top: 2px;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .system-message {
        text-align: center;
        color: #999;
        font-size: 13px;
        padding: 8px;
      }

      .message {
        max-width: 75%;
        padding: 10px 14px;
        border-radius: 18px;
        font-size: 14px;
        line-height: 1.4;
        position: relative;
      }

      .message.sent {
        background: #1a73e8;
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
      }

      .message.received {
        background: #f1f3f4;
        color: #202124;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
      }

      .message .sender {
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 3px;
        opacity: 0.7;
      }

      .message .time {
        font-size: 10px;
        margin-top: 4px;
        opacity: 0.6;
        text-align: right;
      }

      .seen-label {
        font-size: 10px;
        text-align: right;
        opacity: 0.7;
        margin-top: 2px;
      }

      #typing-indicator {
        padding: 4px 16px;
        font-size: 12px;
        color: #999;
        min-height: 20px;
      }

      #message-form {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid #e8eaed;
      }

      #message-input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid #e0e0e0;
        border-radius: 24px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }

      #message-input:focus {
        border-color: #1a73e8;
      }
      #message-input:disabled {
        background: #f5f5f5;
        cursor: not-allowed;
      }

      #send-button {
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 24px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      #send-button:hover {
        background: #1557b0;
      }
      #send-button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      /* Inbox panel for lenders with multiple chats */
      #chat-list-panel {
        width: 260px;
        height: 600px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        margin-right: 16px;
      }

      #chat-list-header {
        background: #1a73e8;
        color: white;
        padding: 16px 20px;
        font-weight: 700;
        font-size: 16px;
      }

      #chat-list {
        flex: 1;
        overflow-y: auto;
      }

      .chat-list-item {
        padding: 14px 16px;
        border-bottom: 1px solid #f0f0f0;
        cursor: pointer;
        transition: background 0.15s;
      }

      .chat-list-item:hover {
        background: #f5f9ff;
      }
      .chat-list-item.active {
        background: #e8f0fe;
      }

      .chat-list-item .car-label {
        font-size: 13px;
        font-weight: 600;
        color: #202124;
      }

      .chat-list-item .borrower-label {
        font-size: 12px;
        color: #888;
        margin-top: 2px;
      }

      .chat-list-empty {
        padding: 24px 16px;
        text-align: center;
        color: #aaa;
        font-size: 13px;
      }

      .wrapper {
        display: flex;
        align-items: flex-start;
      }
    </style>
  </head>
  <body>
    <!--
      For testing: set these to your lender's userId.
      In production these would be injected by your server.
    -->
    <script>
      window.__CURRENT_USER_ID__ = "6f1bccdf-1423-4550-a6a7-4533d64f7a9d"; // lender's userId
      window.__AUTHENTICATE_AS__ = "6f1bccdf-1423-4550-a6a7-4533d64f7a9d";
    </script>

    <div class="wrapper">
      <!-- Left: inbox of all chats for this lender -->
      <div id="chat-list-panel">
        <div id="chat-list-header">📬 Inbox</div>
        <div id="chat-list">
          <div class="chat-list-empty">Loading chats...</div>
        </div>
      </div>

      <!-- Right: active chat window -->
      <div id="chat-widget">
        <div id="chat-header">
          <img
            id="borrower-avatar"
            src="https://placehold.co/40x40"
            alt="Borrower avatar"
          />
          <div>
            <div id="borrower-name">Select a conversation</div>
            <div id="chat-status">—</div>
          </div>
        </div>

        <div id="messages">
          <div id="messages-loader" class="system-message">
            Select a chat from the inbox to start.
          </div>
        </div>

        <div id="typing-indicator"></div>

        <form id="message-form">
          <input
            type="text"
            id="message-input"
            placeholder="Type a message..."
            autocomplete="off"
            disabled
          />
          <button type="submit" id="send-button" disabled>Send</button>
        </form>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io({
        auth: { token: localStorage.getItem("token") },
      });

      let currentChatId = null;
      let typingTimer;

      const messagesDiv = document.getElementById("messages");
      const messageForm = document.getElementById("message-form");
      const messageInput = document.getElementById("message-input");
      const typingIndicator = document.getElementById("typing-indicator");
      const borrowerName = document.getElementById("borrower-name");
      const chatStatus = document.getElementById("chat-status");
      const chatList = document.getElementById("chat-list");

      // ── Connect & authenticate ──────────────────────────────────────────────

      socket.on("connect", () => {
        console.log("✅ Lender socket connected");

        socket.emit("authenticate", window.__AUTHENTICATE_AS__, (response) => {
          if (response?.success) {
            console.log("✅ Lender authenticated");
            // Ask server for all chats where this user is the lender
            socket.emit("get_lender_chats");
          } else {
            console.error("❌ Auth failed", response);
          }
        });
      });

      // ── Inbox: list of all chats ────────────────────────────────────────────

      socket.on("lender_chats", (chats) => {
        chatList.innerHTML = "";
        if (!chats.length) {
          chatList.innerHTML =
            '<div class="chat-list-empty">No conversations yet.</div>';
          return;
        }
        chats.forEach((chat) => {
          const item = document.createElement("div");
          item.className = "chat-list-item";
          item.dataset.chatId = chat.id;
          item.innerHTML = `
            <div class="car-label">🚗 ${chat.car?.name ?? chat.carId.slice(0, 8)}</div>
            <div class="borrower-label">From: ${chat.user?.name ?? "Borrower"}</div>
          `;
          item.addEventListener("click", () => openChat(chat));
          chatList.appendChild(item);
        });
      });

      function openChat(chat) {
        // Highlight active item
        document
          .querySelectorAll(".chat-list-item")
          .forEach((el) =>
            el.classList.toggle("active", el.dataset.chatId === chat.id),
          );

        // Leave old room
        if (currentChatId) socket.emit("leave_chat", currentChatId);

        currentChatId = chat.id;
        borrowerName.textContent = chat.user?.name ?? "Borrower";
        chatStatus.textContent = "Loading...";
        messagesDiv.innerHTML =
          '<div class="system-message">Loading messages...</div>';
        messageInput.disabled = true;
        document.getElementById("send-button").disabled = true;

        socket.emit("join_chat", chat.id);
      }

      // ── Message history ─────────────────────────────────────────────────────

      socket.on("message_history", (messages) => {
        messagesDiv.innerHTML = "";
        if (!messages.length) {
          messagesDiv.innerHTML =
            '<div class="system-message">No messages yet. Say hello!</div>';
        } else {
          messages.forEach(renderMessage);
        }
        scrollToBottom();
        chatStatus.textContent = "Active";
        messageInput.disabled = false;
        document.getElementById("send-button").disabled = false;
        socket.emit("mark_read", currentChatId);
      });

      // ── Send message ────────────────────────────────────────────────────────

      messageForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = messageInput.value.trim();
        if (!text || !currentChatId) return;

        socket.emit("send_message", {
          chatId: currentChatId,
          messageText: text,
        });
        messageInput.value = "";
        socket.emit("stop_typing", currentChatId);
        clearTimeout(typingTimer);
      });

      // ── Receive messages ────────────────────────────────────────────────────

      socket.on("new_message", (message) => {
        if (message.chatId !== currentChatId) {
          // Flash the inbox item to show unread
          const item = chatList.querySelector(
            `[data-chat-id="${message.chatId}"]`,
          );
          if (item) item.style.fontWeight = "700";
          return;
        }
        renderMessage(message);
        scrollToBottom();
        socket.emit("mark_read", currentChatId);
      });

      socket.on("messages_read", ({ readBy }) => {
        const sentMessages = messagesDiv.querySelectorAll(".message.sent");
        if (sentMessages.length > 0) {
          const last = sentMessages[sentMessages.length - 1];
          let seenLabel = last.querySelector(".seen-label");
          if (!seenLabel) {
            seenLabel = document.createElement("div");
            seenLabel.className = "seen-label";
            last.appendChild(seenLabel);
          }
          seenLabel.textContent = "Seen";
        }
      });

      // ── Typing indicators ───────────────────────────────────────────────────

      messageInput.addEventListener("input", () => {
        if (!currentChatId) return;
        socket.emit("typing", currentChatId);
        clearTimeout(typingTimer);
        typingTimer = setTimeout(
          () => socket.emit("stop_typing", currentChatId),
          1000,
        );
      });

      socket.on("typing", ({ chatId }) => {
        if (chatId === currentChatId)
          typingIndicator.textContent = "Borrower is typing...";
      });

      socket.on("stop_typing", ({ chatId }) => {
        if (chatId === currentChatId) typingIndicator.textContent = "";
      });

      // ── Errors ──────────────────────────────────────────────────────────────

      socket.on("error", (msg) => console.error("Chat error:", msg));
      socket.on("connect_error", (err) =>
        console.error("Connection failed:", err.message),
      );
      socket.on("reconnect", () => {
        if (currentChatId) socket.emit("join_chat", currentChatId);
      });

      // ── Helpers ─────────────────────────────────────────────────────────────

      function renderMessage(message) {
        const myUserId = window.__CURRENT_USER_ID__;
        const isMine = message.senderId === myUserId;

        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${isMine ? "sent" : "received"}`;
        msgDiv.innerHTML = `
          <div class="sender">${isMine ? "You" : (message.sender?.name ?? "Borrower")}</div>
          <div class="text">${escapeHtml(message.messageText)}</div>
          <div class="time">${new Date(message.createdAt).toLocaleTimeString()}</div>
          ${message.status === "read" && isMine ? '<div class="seen-label">Seen</div>' : ""}
        `;
        messagesDiv.appendChild(msgDiv);
      }

      function scrollToBottom() {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.appendChild(document.createTextNode(text));
        return div.innerHTML;
      }
    </script>
  </body>
</html>
